<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>اطلاعات حساب کاربری</title>
    <!-- اتصال به کیت توسعه ایتا (طبق مستندات، باید در head و قبل از هر اسکریپت دیگری باشد) -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* استفاده از ارتفاع پویا برای پر کردن تمام صفحه در WebView */
            min-height: 100vh;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 40px;
            color: #888;
            border: 2px solid #f5f5f5;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .full-name {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .username {
            font-size: 14px;
            color: #888;
            direction: ltr;
            display: inline-block;
        }

        .info-card {
            background-color: #f9f9f9;
            border-radius: 16px;
            padding: 8px 20px;
            border: 1px solid #f0f0f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .info-value {
            font-size: 15px;
            color: #111;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .btn-primary {
            background-color: #2f7cf6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(47, 124, 246, 0.25);
        }

        .btn-secondary {
            background-color: #f2f2f2;
            color: #333333;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #888;
            font-size: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #2f7cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            color: #e53935;
            font-size: 15px;
            line-height: 1.7;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- حالت بارگذاری -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>در حال دریافت اطلاعات...</span>
    </div>

    <!-- حالت خطا -->
    <div id="error" class="error hidden"></div>

    <!-- محتوای اصلی -->
    <div id="content" class="container hidden">
        <div class="header">
            <div class="avatar" id="avatar">
                <span id="avatarInitial">؟</span>
            </div>
            <div class="full-name" id="fullName">—</div>
            <div class="username" id="username"></div>
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">شناسه کاربری</span>
                <span class="info-value" id="userId">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام</span>
                <span class="info-value" id="firstName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام خانوادگی</span>
                <span class="info-value" id="lastName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام کاربری</span>
                <span class="info-value" id="userName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">زبان</span>
                <span class="info-value" id="languageCode">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">پلتفرم</span>
                <span class="info-value" id="platform">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نسخه کیت</span>
                <span class="info-value" id="sdkVersion">—</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="refreshBtn">🔄 دریافت مجدد اطلاعات</button>
            <button class="btn btn-secondary" id="closeBtn">✖ بستن برنامه</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // عناصر DOM
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const contentEl = document.getElementById('content');

            // تابع کمکی برای ویبره (بازخورد لمسی)
            function vibrate(type) {
                try {
                    if (window.Eitaa && window.Eitaa.WebApp && window.Eitaa.WebApp.HapticFeedback) {
                        const hf = window.Eitaa.WebApp.HapticFeedback;
                        switch (type) {
                            case 'light':
                                hf.impactOccurred('light');
                                break;
                            case 'medium':
                                hf.impactOccurred('medium');
                                break;
                            case 'heavy':
                                hf.impactOccurred('heavy');
                                break;
                            case 'success':
                                hf.notificationOccurred('success');
                                break;
                            case 'error':
                                hf.notificationOccurred('error');
                                break;
                            case 'warning':
                                hf.notificationOccurred('warning');
                                break;
                            default:
                                hf.impactOccurred('light');
                        }
                    }
                } catch (e) {
                    // نادیده گرفتن خطا در صورت عدم پشتیبانی
                }
            }

            // نمایش خطا
            function showError(message) {
                loadingEl.classList.add('hidden');
                contentEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                errorEl.textContent = message;
            }

            // نمایش محتوا
            function showContent() {
                loadingEl.classList.add('hidden');
                errorEl.classList.add('hidden');
                contentEl.classList.remove('hidden');
            }

            // به‌روزرسانی UI با داده‌های کاربر
            function renderUserData(user) {
                const firstName = user.first_name || '';
                const lastName = user.last_name || '';
                const userName = user.username || '';
                const userId = user.id != null ? user.id : '—';
                const languageCode = user.language_code || '—';

                // نام کامل
                const fullName = [firstName, lastName].filter(Boolean).join(' ') || 'کاربر ایتا';
                document.getElementById('fullName').textContent = fullName;

                // حرف اول برای آواتار
                const initial = firstName ? firstName.charAt(0) : (userName ? userName.charAt(0) : '؟');
                document.getElementById('avatarInitial').textContent = initial;

                // آواتار تصویری (در صورت وجود photo_url)
                if (user.photo_url) {
                    const avatarEl = document.getElementById('avatar');
                    avatarEl.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = user.photo_url;
                    img.alt = fullName;
                    img.onerror = function () {
                        avatarEl.innerHTML = '<span>' + initial + '</span>';
                    };
                    avatarEl.appendChild(img);
                }

                // نام کاربری
                const usernameEl = document.getElementById('username');
                if (userName) {
                    usernameEl.textContent = '@' + userName;
                } else {
                    usernameEl.textContent = '';
                }

                // سایر فیلدها
                document.getElementById('userId').textContent = userId;
                document.getElementById('firstName').textContent = firstName || '—';
                document.getElementById('lastName').textContent = lastName || '—';
                document.getElementById('userName').textContent = userName ? '@' + userName : '—';
                document.getElementById('languageCode').textContent = languageCode;

                // اطلاعات SDK
                const wa = window.Eitaa.WebApp;
                document.getElementById('platform').textContent = wa.platform || '—';
                document.getElementById('sdkVersion').textContent = wa.version || '—';
            }

            // بارگذاری اطلاعات کاربر از SDK
            function loadUserData() {
                loadingEl.classList.remove('hidden');
                contentEl.classList.add('hidden');
                errorEl.classList.add('hidden');

                // بررسی وجود SDK
                if (!window.Eitaa || !window.Eitaa.WebApp) {
                    showError('کیت توسعه ایتا در دسترس نیست. لطفاً این برنامه را از داخل پیام‌رسان ایتا باز کنید.');
                    return;
                }

                const wa = window.Eitaa.WebApp;

                // اطلاع به ایتا که برنامه آماده نمایش است
                try {
                    wa.ready();
                } catch (e) {}

                // درخواست حالت تمام صفحه
                try {
                    wa.expand();
                } catch (e) {}

                // تنظیم رنگ پس‌زمینه سفید
                try {
                    wa.setBackgroundColor('#ffffff');
                    wa.setHeaderColor('#ffffff');
                } catch (e) {}

                // تلاش برای دریافت داده‌های کاربر
                let user = null;

                // روش 1: از طریق initDataUnsafe.user
                if (wa.initDataUnsafe && wa.initDataUnsafe.user) {
                    user = wa.initDataUnsafe.user;
                }

                // روش 2: اگر user نبود، از initData پارس کنیم
                if (!user && wa.initData) {
                    try {
                        const params = new URLSearchParams(wa.initData);
                        const userStr = params.get('user');
                        if (userStr) {
                            user = JSON.parse(userStr);
                        }
                    } catch (e) {
                        console.warn('خطا در پارس initData:', e);
                    }
                }

                // نمایش داده‌ها
                if (user) {
                    renderUserData(user);
                    showContent();
                } else {
                    showError('اطلاعات حساب کاربری در دسترس نیست. لطفاً از داخل ایتا برنامه را باز کنید.');
                }
            }

            // رویداد کلیک دکمه دریافت مجدد
            document.getElementById('refreshBtn').addEventListener('click', function () {
                vibrate('medium');
                loadUserData();
            });

            // رویداد کلیک دکمه بستن
            document.getElementById('closeBtn').addEventListener('click', function () {
                vibrate('medium');
                try {
                    if (window.Eitaa && window.Eitaa.WebApp) {
                        window.Eitaa.WebApp.close();
                    }
                } catch (e) {}
            });

            // راه‌اندازی اولیه هنگام بارگذاری صفحه
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadUserData);
            } else {
                loadUserData();
            }

            // گوش دادن به رویداد تغییر تم (اختیاری)
            try {
                if (window.Eitaa && window.Eitaa.WebApp && window.Eitaa.WebApp.onEvent) {
                    window.Eitaa.WebApp.onEvent('themeChanged', function () {
                        // در صورت نیاز می‌توان رنگ‌ها را تغییر داد
                    });
                }
            } catch (e) {}

        })();
    </script>
</body>
</html>
