<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>پروفایل کاربری</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #222222;
            min-height: 100vh;
            min-height: 100dvh;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ---------- پروفایل ---------- */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 8px 0 4px;
            position: relative;
        }

        .avatar {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8f0fe, #d4e4fc);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            font-size: 42px;
            font-weight: 700;
            color: #2f7cf6;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 16px rgba(47, 124, 246, 0.15);
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .full-name {
            font-size: clamp(19px, 5.5vw, 23px);
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
            word-break: break-word;
            line-height: 1.4;
        }

        .username {
            font-size: clamp(13px, 3.8vw, 15px);
            color: #2f7cf6;
            direction: ltr;
            display: inline-block;
            word-break: break-all;
            font-weight: 500;
        }

        /* ---------- کارت اطلاعات ---------- */
        .info-card {
            background-color: #f9f9f9;
            border-radius: 16px;
            padding: 4px 18px;
            border: 1px solid #f0f0f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: clamp(12px, 3.5vw, 14px);
            color: #666;
            font-weight: 500;
            flex-shrink: 0;
        }

        .info-value {
            font-size: clamp(13px, 3.8vw, 15px);
            color: #111;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            word-break: break-all;
            max-width: 60%;
        }

        /* ---------- دکمه‌ها ---------- */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #2f7cf6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(47, 124, 246, 0.25);
        }

        .btn-secondary {
            background-color: #f2f2f2;
            color: #333333;
        }

        /* چرخش آیکون رفرش هنگام بروزرسانی */
        .btn.refreshing .icon-refresh {
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- حالت‌های بارگذاری و خطا ---------- */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #888;
            font-size: 15px;
            padding: 60px 20px;
            width: 100%;
            max-width: 480px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #2f7cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .error {
            text-align: center;
            color: #e53935;
            font-size: 15px;
            line-height: 1.8;
            padding: 40px 20px;
            width: 100%;
            max-width: 480px;
            word-break: break-word;
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>در حال دریافت پروفایل...</span>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="content" class="container hidden">
        <div class="profile">
            <div class="avatar" id="avatar">
                <span id="avatarInitial">؟</span>
            </div>
            <div class="full-name" id="fullName">—</div>
            <div class="username" id="username"></div>
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">شناسه کاربری</span>
                <span class="info-value" id="userId">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام</span>
                <span class="info-value" id="firstName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام خانوادگی</span>
                <span class="info-value" id="lastName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">زبان</span>
                <span class="info-value" id="languageCode">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">پلتفرم</span>
                <span class="info-value" id="platform">—</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="refreshBtn" type="button">
                <span class="icon-refresh">🔄</span> بروزرسانی اطلاعات
            </button>
            <button class="btn btn-secondary" id="closeBtn" type="button">✖ بستن برنامه</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var loadingEl = document.getElementById('loading');
            var errorEl = document.getElementById('error');
            var contentEl = document.getElementById('content');
            var refreshBtn = document.getElementById('refreshBtn');
            var isRefreshing = false;

            /* ---------- ویبره ---------- */
            function vibrate(type) {
                try {
                    var wa = window.Eitaa && window.Eitaa.WebApp;
                    if (wa && wa.HapticFeedback) {
                        var hf = wa.HapticFeedback;
                        if (type === 'success' || type === 'error' || type === 'warning') {
                            hf.notificationOccurred(type);
                        } else {
                            hf.impactOccurred(type || 'light');
                        }
                    } else if (navigator.vibrate) {
                        navigator.vibrate(15);
                    }
                } catch (e) {}
            }

            /* ---------- نمایش حالت‌ها ---------- */
            function showError(msg) {
                loadingEl.classList.add('hidden');
                contentEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                errorEl.textContent = msg;
            }
            function showContent() {
                loadingEl.classList.add('hidden');
                errorEl.classList.add('hidden');
                contentEl.classList.remove('hidden');
            }

            /* ---------- پارس امن initData ---------- */
            function parseInitData(initData) {
                var result = { user: null };
                if (!initData || typeof initData !== 'string') return result;
                try {
                    var params = new URLSearchParams(initData);
                    var userStr = params.get('user');
                    if (userStr) result.user = JSON.parse(userStr);
                } catch (e) {}
                return result;
            }

            /* ---------- رندر پروفایل ---------- */
            function renderProfile(user) {
                var firstName = (user && user.first_name) || '';
                var lastName = (user && user.last_name) || '';
                var userName = (user && user.username) || '';
                var userId = (user && user.id != null) ? user.id : '—';
                var languageCode = (user && user.language_code) || '—';
                var photoUrl = (user && (user.photo_url || user.photo)) || null;

                // نام کامل
                var fullName = [firstName, lastName].filter(Boolean).join(' ') || 'کاربر ایتا';
                document.getElementById('fullName').textContent = fullName;

                // حرف اول
                var initial = firstName ? firstName.charAt(0) : (userName ? userName.charAt(0) : '؟');

                // آواتار
                var avatarEl = document.getElementById('avatar');
                if (photoUrl) {
                    avatarEl.innerHTML = '';
                    var img = document.createElement('img');
                    img.src = photoUrl;
                    img.alt = fullName;
                    img.onerror = function () {
                        avatarEl.innerHTML = '<span>' + initial + '</span>';
                    };
                    avatarEl.appendChild(img);
                } else {
                    avatarEl.innerHTML = '<span>' + initial + '</span>';
                }

                // نام کاربری
                var usernameEl = document.getElementById('username');
                usernameEl.textContent = userName ? '@' + userName : '';

                // فیلدها
                document.getElementById('userId').textContent = userId;
                document.getElementById('firstName').textContent = firstName || '—';
                document.getElementById('lastName').textContent = lastName || '—';
                document.getElementById('languageCode').textContent = languageCode;
            }

            /* ---------- دریافت user تازه از SDK ---------- */
            function fetchUserFromSDK(wa) {
                var user = null;

                // اولویت ۱: initData (امن‌تر)
                if (wa.initData) {
                    var parsed = parseInitData(wa.initData);
                    user = parsed.user;
                }
                // اولویت ۲: initDataUnsafe
                if (!user && wa.initDataUnsafe && wa.initDataUnsafe.user) {
                    user = wa.initDataUnsafe.user;
                }
                return user;
            }

            /* ---------- بارگذاری اولیه ---------- */
            function loadProfile() {
                loadingEl.classList.remove('hidden');
                contentEl.classList.add('hidden');
                errorEl.classList.add('hidden');

                var wa = window.Eitaa && window.Eitaa.WebApp;
                if (!wa) {
                    showError('کیت توسعه ایتا در دسترس نیست. لطفاً این برنامه را از داخل پیام‌رسان ایتا باز کنید.');
                    return;
                }

                try { wa.ready(); } catch (e) {}
                try { wa.expand(); } catch (e) {}
                try {
                    wa.setBackgroundColor('#ffffff');
                    wa.setHeaderColor('#ffffff');
                } catch (e) {}

                var user = fetchUserFromSDK(wa);

                if (!user) {
                    showError('اطلاعات پروفایل در دسترس نیست.\nلطفاً از داخل ایتا برنامه را باز کنید.');
                    return;
                }

                renderProfile(user);
                document.getElementById('platform').textContent = wa.platform || '—';

                showContent();
            }

            /* ---------- بروزرسانی ---------- */
            function refreshProfile() {
                if (isRefreshing) return;

                var wa = window.Eitaa && window.Eitaa.WebApp;
                if (!wa) {
                    vibrate('error');
                    showError('کیت توسعه ایتا در دسترس نیست.');
                    return;
                }

                isRefreshing = true;
                refreshBtn.disabled = true;
                refreshBtn.classList.add('refreshing');
                refreshBtn.innerHTML = '<span class="icon-refresh">🔄</span> در حال بروزرسانی...';

                // کمی تأخیر کوتاه برای نمایش انیمیشن و دریافت داده تازه
                setTimeout(function () {
                    try {
                        var user = fetchUserFromSDK(wa);

                        if (user) {
                            renderProfile(user);
                            document.getElementById('platform').textContent = wa.platform || '—';
                            vibrate('success');
                        } else {
                            vibrate('error');
                        }
                    } catch (e) {
                        vibrate('error');
                    }

                    // بازگرداندن دکمه به حالت عادی
                    isRefreshing = false;
                    refreshBtn.disabled = false;
                    refreshBtn.classList.remove('refreshing');
                    refreshBtn.innerHTML = '<span class="icon-refresh">🔄</span> بروزرسانی اطلاعات';
                }, 600);
            }

            /* ---------- رویدادها ---------- */
            refreshBtn.addEventListener('click', function () {
                vibrate('medium');
                refreshProfile();
            });

            document.getElementById('closeBtn').addEventListener('click', function () {
                vibrate('medium');
                try {
                    if (window.Eitaa && window.Eitaa.WebApp) {
                        window.Eitaa.WebApp.close();
                    }
                } catch (e) {}
            });

            /* ---------- راه‌اندازی ---------- */
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadProfile);
            } else {
                loadProfile();
            }

        })();
    </script>
</body>
</html>
