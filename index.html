<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>اطلاعات حساب کاربری</title>
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background-color: #ffffff;
            color: #222222;
            min-height: 100vh;
            min-height: 100dvh;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .page-title {
            text-align: center;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .info-card {
            background-color: #f9f9f9;
            border-radius: 16px;
            padding: 4px 18px;
            border: 1px solid #f0f0f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: clamp(12px, 3.5vw, 14px);
            color: #666;
            font-weight: 500;
            flex-shrink: 0;
        }

        .info-value {
            font-size: clamp(13px, 3.8vw, 15px);
            color: #111;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            word-break: break-all;
            max-width: 60%;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .btn-primary {
            background-color: #2f7cf6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(47, 124, 246, 0.25);
        }

        .btn-secondary {
            background-color: #f2f2f2;
            color: #333333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #888;
            font-size: 15px;
            padding: 60px 20px;
            width: 100%;
            max-width: 480px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #2f7cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            color: #e53935;
            font-size: 15px;
            line-height: 1.8;
            padding: 40px 20px;
            width: 100%;
            max-width: 480px;
            word-break: break-word;
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>در حال دریافت اطلاعات...</span>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="content" class="container hidden">
        <div class="page-title">اطلاعات حساب کاربری</div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">شناسه کاربری</span>
                <span class="info-value" id="userId">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام</span>
                <span class="info-value" id="firstName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">نام خانوادگی</span>
                <span class="info-value" id="lastName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">زبان</span>
                <span class="info-value" id="languageCode">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">پلتفرم</span>
                <span class="info-value" id="platform">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">شماره تلفن</span>
                <span class="info-value" id="phoneNumber">دریافت نشده</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="phoneBtn" type="button">📱 دریافت شماره تلفن</button>
            <button class="btn btn-secondary" id="closeBtn" type="button">✖ بستن برنامه</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var loadingEl = document.getElementById('loading');
            var errorEl = document.getElementById('error');
            var contentEl = document.getElementById('content');
            var phoneBtn = document.getElementById('phoneBtn');
            var phoneNumberEl = document.getElementById('phoneNumber');

            /* ---------- ویبره ---------- */
            function vibrate(type) {
                try {
                    var wa = window.Eitaa && window.Eitaa.WebApp;
                    if (wa && wa.HapticFeedback) {
                        var hf = wa.HapticFeedback;
                        if (type === 'success' || type === 'error' || type === 'warning') {
                            hf.notificationOccurred(type);
                        } else {
                            hf.impactOccurred(type || 'light');
                        }
                    } else if (navigator.vibrate) {
                        navigator.vibrate(15);
                    }
                } catch (e) {}
            }

            /* ---------- نمایش حالت‌ها ---------- */
            function showError(msg) {
                loadingEl.classList.add('hidden');
                contentEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                errorEl.textContent = msg;
            }
            function showContent() {
                loadingEl.classList.add('hidden');
                errorEl.classList.add('hidden');
                contentEl.classList.remove('hidden');
            }

            /* ---------- پارس امن initData ---------- */
            function parseInitData(initData) {
                var result = { user: null };
                if (!initData || typeof initData !== 'string') return result;
                try {
                    var params = new URLSearchParams(initData);
                    var userStr = params.get('user');
                    if (userStr) result.user = JSON.parse(userStr);
                } catch (e) {}
                return result;
            }

            /* ---------- رندر اطلاعات کاربر ---------- */
            function renderUserData(user) {
                if (!user) {
                    document.getElementById('userId').textContent = '—';
                    document.getElementById('firstName').textContent = '—';
                    document.getElementById('lastName').textContent = '—';
                    document.getElementById('languageCode').textContent = '—';
                    return;
                }

                document.getElementById('userId').textContent =
                    (user.id != null) ? user.id : '—';
                document.getElementById('firstName').textContent =
                    user.first_name || '—';
                document.getElementById('lastName').textContent =
                    user.last_name || '—';
                document.getElementById('languageCode').textContent =
                    user.language_code || '—';
            }

            /* ---------- بارگذاری اطلاعات ---------- */
            function loadUserData() {
                loadingEl.classList.remove('hidden');
                contentEl.classList.add('hidden');
                errorEl.classList.add('hidden');

                var wa = window.Eitaa && window.Eitaa.WebApp;
                if (!wa) {
                    showError('کیت توسعه ایتا در دسترس نیست. لطفاً این برنامه را از داخل پیام‌رسان ایتا باز کنید.');
                    return;
                }

                try { wa.ready(); } catch (e) {}
                try { wa.expand(); } catch (e) {}
                try {
                    wa.setBackgroundColor('#ffffff');
                    wa.setHeaderColor('#ffffff');
                } catch (e) {}

                // دریافت user از initData (امن‌تر) با fallback به initDataUnsafe
                var user = null;

                if (wa.initData) {
                    var parsed = parseInitData(wa.initData);
                    user = parsed.user;
                }
                if (!user && wa.initDataUnsafe && wa.initDataUnsafe.user) {
                    user = wa.initDataUnsafe.user;
                }

                if (!user) {
                    showError('اطلاعات حساب کاربری در دسترس نیست.\nلطفاً از داخل ایتا برنامه را باز کنید.');
                    return;
                }

                renderUserData(user);
                document.getElementById('platform').textContent = wa.platform || '—';

                showContent();
            }

            /* ---------- دریافت شماره تلفن ---------- */
            function requestPhoneNumber() {
                var wa = window.Eitaa && window.Eitaa.WebApp;
                if (!wa || typeof wa.requestContact !== 'function') {
                    vibrate('error');
                    try {
                        wa.showAlert('درخواست شماره تلفن در این نسخه از ایتا پشتیبانی نمی‌شود.');
                    } catch (e) {
                        alert('درخواست شماره تلفن در این نسخه از ایتا پشتیبانی نمی‌شود.');
                    }
                    return;
                }

                phoneBtn.disabled = true;
                phoneBtn.textContent = '⏳ در حال دریافت...';

                // requestContact یک پاپ‌آپ بومی باز می‌کند
                try {
                    wa.requestContact(function (granted, contactData) {
                        phoneBtn.disabled = false;
                        phoneBtn.textContent = '📱 دریافت شماره تلفن';

                        if (granted && contactData) {
                            vibrate('success');
                            // contactData یک رشته است شامل شماره و hash
                            // فرمت معمول: "phone_number=+98...&hash=..."
                            var phone = '—';
                            try {
                                var params = new URLSearchParams(contactData);
                                var p = params.get('phone_number') || params.get('contact');
                                if (p) {
                                    phone = p;
                                } else {
                                    // اگر فرمت متفاوت بود، کل رشته را نشان بده
                                    phone = contactData;
                                }
                            } catch (e) {
                                phone = contactData;
                            }
                            phoneNumberEl.textContent = phone;
                            phoneNumberEl.style.direction = 'ltr';
                        } else {
                            vibrate('warning');
                            phoneNumberEl.textContent = 'اجازه داده نشد';
                        }
                    });
                } catch (e) {
                    phoneBtn.disabled = false;
                    phoneBtn.textContent = '📱 دریافت شماره تلفن';
                    vibrate('error');
                    try {
                        wa.showAlert('خطا در درخواست شماره تلفن: ' + e.message);
                    } catch (err) {}
                }
            }

            /* ---------- رویدادها ---------- */
            phoneBtn.addEventListener('click', function () {
                vibrate('medium');
                requestPhoneNumber();
            });

            document.getElementById('closeBtn').addEventListener('click', function () {
                vibrate('medium');
                try {
                    if (window.Eitaa && window.Eitaa.WebApp) {
                        window.Eitaa.WebApp.close();
                    }
                } catch (e) {}
            });

            /* ---------- راه‌اندازی ---------- */
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadUserData);
            } else {
                loadUserData();
            }

        })();
    </script>
</body>
</html>
